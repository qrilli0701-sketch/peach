<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    :root{
      --ground:#FFF6F0; --panel:#FFFFFF; --panel-2:#FFF0E8;
      --ink:#2C221B; --soft:#6E5D50; --line:#E6D8CA;
      --accent:#EC6249; --accent-dk:#CF4B33; --accent-soft:#FFE3D8;
      --grad:linear-gradient(135deg,#FF9F7A 0%,#F0604D 100%);
      --ok:#2F8F5B; --ok-soft:#E1F3E8; --warn:#8A6D00; --warn-soft:#FFF4B8;
      --danger:#C0392B; --shadow:0 2px 4px rgba(120,50,30,.04),0 12px 32px rgba(120,50,30,.08);
    }
    @media (prefers-color-scheme:dark){:root{
      --ground:#1E1712; --panel:#2A211B; --panel-2:#332821;
      --ink:#F1E7DD; --soft:#B7A596; --line:#42342A;
      --accent:#F08A63; --accent-dk:#F5A582; --accent-soft:#4A2E22;
      --grad:linear-gradient(135deg,#F59B78 0%,#E5604C 100%);
      --ok:#74C995; --ok-soft:#1F3A2A; --warn:#F2D36B; --warn-soft:#3E3518;
      --danger:#E8776A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
    }}
    *{box-sizing:border-box}
    body{margin:0;background:var(--ground);color:var(--ink);
      font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
      line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
    .wrap{max-width:560px;margin:0 auto;padding:0 16px}
    button{font-family:inherit;cursor:pointer}
    a{color:inherit}
    .hide{display:none!important}

    /* 로그인 */
    #login{padding:64px 0 40px}
    #login h1{font-family:"Gowun Batang",serif;font-size:1.8rem;text-align:center;margin:0 0 6px}
    #login .sub{text-align:center;color:var(--soft);font-size:.88rem;margin:0 0 28px}
    .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px 22px;box-shadow:var(--shadow)}
    label{display:block;font-size:.8rem;font-weight:600;margin:12px 0 5px;color:var(--soft)}
    input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
      font-size:1rem;background:var(--panel);color:var(--ink);font-family:inherit}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
    .who-pick{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
    .chip{flex:1 1 28%;padding:13px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);
      color:var(--ink);font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer}
    .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dk);box-shadow:0 0 0 3px var(--accent-soft)}
    .btnrow{display:flex;gap:8px}
    .dl{flex:1;margin:12px 0 0;padding:12px;border:1.5px solid var(--accent);border-radius:12px;background:var(--panel);
      color:var(--accent-dk);font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer}
    .dl:disabled{opacity:.5}
    /* 알림판 (태블릿용) */
    #board{min-height:100vh;padding:0 0 28px}
    .btop{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
    .btop h1{font-family:"Gowun Batang",serif;font-size:1.5rem;margin:0;flex:1}
    .btop .clock{font-size:1.1rem;color:var(--soft);font-weight:600}
    .bwrap{max-width:1100px;margin:0 auto;padding:0 20px}
    .bcount{display:flex;align-items:baseline;gap:14px;margin:22px 0 10px}
    .bcount .num{font-size:clamp(3.2rem,9vw,5.5rem);font-weight:800;line-height:1;color:var(--accent-dk)}
    .bcount .unit{font-size:1.4rem;font-weight:700}
    .bcount .sub{margin-left:auto;color:var(--soft);font-size:1.05rem;font-weight:600}
    #bNew{display:none;margin:0 0 14px;padding:16px 20px;border-radius:16px;background:var(--grad);color:#fff;
      font-size:1.6rem;font-weight:800;text-align:center;animation:pulse 1s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.015);opacity:.88}}
    .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
    .bcard{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);
      border-left:8px solid var(--accent);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);color:var(--ink)}
    .bcard.fresh{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
    .bcard.warn{border-left-color:#E8C200}
    .bcard .b1{display:flex;align-items:center;gap:10px}
    .bcard .bs{font-size:1.45rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bcard .bq{font-size:1.45rem;font-weight:800;color:var(--accent-dk);white-space:nowrap}
    .bcard .b2{font-size:1.2rem;margin-top:4px}
    .bcard .b3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--soft);font-size:.95rem}
    .bempty{text-align:center;font-size:1.7rem;color:var(--soft);padding:70px 0}
    .bfoot{text-align:center;color:var(--soft);font-size:.95rem;margin-top:22px}
    .primary{width:100%;margin-top:18px;padding:15px;border:none;border-radius:14px;background:var(--grad);
      color:#fff;font-size:1.02rem;font-weight:700;box-shadow:0 6px 16px rgba(236,98,73,.3)}
    .primary:disabled{opacity:.5}
    .err{color:var(--danger);font-size:.84rem;text-align:center;min-height:1.2em;margin:10px 0 0}

    /* 상단 */
    header{position:sticky;top:0;z-index:5;background:var(--ground);padding:14px 0 10px;border-bottom:1px solid var(--line)}
    .top{display:flex;align-items:center;gap:10px}
    .top h1{font-family:"Gowun Batang",serif;font-size:1.25rem;margin:0;flex:1}
    .who{font-size:.78rem;color:var(--soft)}
    .icon{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;
      padding:7px 10px;font-size:.82rem;min-height:36px}
    .icon.big{font-size:1.15rem;line-height:1;padding:6px 11px}
    .tabs{display:flex;gap:6px;margin:12px 0 10px}
    .tab{flex:1;padding:9px 4px;border:1.5px solid var(--line);background:var(--panel);color:var(--soft);
      border-radius:12px;font-size:.88rem;font-weight:600}
    .tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dk)}
    .tab .n{font-weight:700}
    #q{padding:11px 14px;font-size:.95rem}

    /* 목록 카드 */
    #list{padding-top:12px;padding-bottom:40px}
    .card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
      border-left:5px solid var(--accent);border-radius:16px;padding:13px 15px;margin-bottom:10px;
      box-shadow:var(--shadow);color:var(--ink)}
    .card.checked{border-left-color:var(--ok)}
    .card.warn{border-left-color:#E8C200;background:var(--warn-soft)}
    .card .l1{display:flex;align-items:center;gap:8px}
    .card .sender{font-weight:700;font-size:1.02rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card .boxes{font-weight:700;color:var(--accent-dk);white-space:nowrap}
    .card .l2{font-size:.88rem;color:var(--ink);margin-top:2px}
    .card .l3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.76rem;color:var(--soft);margin-top:6px}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
    .p-new{background:var(--accent-soft);color:var(--accent-dk)}
    .p-ok{background:var(--ok-soft);color:var(--ok)}
    .p-warn{background:#FFE36E;color:#5C4A00}
    .p-mail{background:var(--panel-2);color:var(--soft);border:1px solid var(--line)}
    .empty{text-align:center;color:var(--soft);padding:50px 0;font-size:.92rem}

    /* 상세 */
    #detail{position:fixed;inset:0;z-index:20;background:var(--ground);overflow-y:auto;padding-bottom:240px}
    #detail header{display:flex;align-items:center;gap:10px}
    #detail header h2{font-size:1.05rem;margin:0;flex:1}
    .sec{font-family:"Gowun Batang",serif;color:var(--accent);font-size:.95rem;margin:18px 0 8px}
    .rc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
    .rc.warn{background:var(--warn-soft);border-color:#E8C200}
    .rc .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
    .rc .nm .q{margin-left:auto;color:var(--accent-dk)}
    .row{display:flex;gap:10px;font-size:.92rem;margin-top:6px}
    .row .k{flex:none;width:44px;color:var(--soft);font-size:.8rem;padding-top:2px}
    .row .v{flex:1;min-width:0;word-break:break-all}
    .tel{color:var(--accent-dk);font-weight:600;text-decoration:none}
    .miss{color:var(--danger);font-weight:600}
    .notice{background:var(--warn-soft);border:1px solid #E8C200;color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.86rem;margin-top:12px}
    .meta{font-size:.8rem;color:var(--soft);margin-top:4px}

    .actbar{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-top:1px solid var(--line);
      border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(120,50,30,.12);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
    .actbar .inner{max-width:560px;margin:0 auto}
    .actbar .primary{margin-top:10px}
    /* 현황 카드 */
    .stats{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;margin-top:12px;box-shadow:var(--shadow)}
    .tiles{display:grid;grid-template-columns:3fr 2fr;gap:0}
    .tiles .grp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .tiles .grp.r{grid-template-columns:repeat(2,1fr);border-left:1px solid var(--line, #ecd9cc);padding-left:6px}
    .tile{text-align:center;min-width:0}
    .tile .v{font-size:1.35rem;font-weight:800;line-height:1.15;color:var(--ink);white-space:nowrap}
    .tile .v small{font-size:.7rem;font-weight:700;color:var(--soft);margin-left:1px}
    .tile .k{font-size:.72rem;color:var(--soft);margin-top:2px}
    .tile.todo .v{color:var(--accent-dk)}
    .sp{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
    .sp .hd{display:flex;align-items:baseline;gap:8px;font-size:.78rem;color:var(--soft)}
    .sp .hd b{color:var(--ink);font-size:.95rem}
    .sp .hd .now{margin-left:auto;color:var(--ink);font-weight:700}
    .sp svg{display:block;width:100%;height:auto;margin-top:4px;touch-action:pan-y;overflow:visible}
    .sp .base{stroke:var(--line);stroke-width:1}
    .sp .area{fill:var(--accent);opacity:.12}
    .sp .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
    .sp .dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
    .sp .rule{stroke:var(--soft);stroke-width:1;stroke-dasharray:3 3;opacity:0}
    .sp .ends{display:flex;justify-content:space-between;font-size:.7rem;color:var(--soft)}
    .sp details{margin-top:6px;font-size:.78rem;color:var(--soft)}
    .sp table{width:100%;border-collapse:collapse;margin-top:6px;font-size:.78rem}
    .sp th,.sp td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);color:var(--ink)}
    .sp th:first-child,.sp td:first-child{text-align:left}
    .sp th{color:var(--soft);font-weight:600}
    .mini{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--soft);border-radius:10px;
      padding:5px 10px;font-size:.78rem;font-weight:600}
    .nm .mini{margin-left:8px}
    .eform label{margin:10px 0 4px}
    .eform input,.eform textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;
      font-size:1rem;background:var(--panel);color:var(--ink);font-family:inherit}
    .eform textarea{min-height:84px;resize:vertical}
    .eform input:focus,.eform textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
    .eform .btns{display:flex;gap:8px;margin-top:14px}
    .eform .btns .primary{margin:0;flex:2}
    .eform .btns .ghost{flex:1}
    .eform .who-pick{margin:4px 0 0}
    .eform .chip{padding:10px 4px;font-size:.92rem}
    .memo{white-space:pre-wrap;font-size:.95rem;margin-top:6px}
    .memo.empty{color:var(--soft)}
    details.log{margin:6px 0 0;font-size:.8rem;color:var(--soft)}
    details.log pre{white-space:pre-wrap;margin:6px 0 0;font-family:inherit}
    .actbar.hide{display:none}
    .tk-label{font-size:.85rem;font-weight:700;color:var(--soft);margin:0 0 8px}
    .actbar .who-pick{margin:0}
    .actbar .chip{padding:11px 4px;font-size:.95rem}
    .okline{display:flex;align-items:center;gap:10px}
    .okline .txt{flex:1;color:var(--ok);font-weight:700;font-size:.95rem}
    .okline .txt small{display:block;color:var(--soft);font-weight:400;font-size:.78rem}
    .ghost{border:1.5px solid var(--line);background:var(--panel);color:var(--soft);border-radius:12px;padding:10px 14px;font-size:.86rem}

    #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--ground);
      padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
    #toast.show{opacity:.95}
  </style>
</head>
<body>

<!-- 로그인 -->
<div id="login" class="wrap hide">
  <h1>🍑 임가네 주문 확인</h1>
  <p class="sub">가족만 들어올 수 있어요</p>
  <div class="box">
    <label for="pw">가족 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="primary" id="loginBtn" onclick="doLogin()">들어가기</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<!-- 목록 -->
<div id="main" class="hide">
  <header>
    <div class="wrap">
      <div class="top">
        <h1>🍑 주문 확인</h1>
        <button class="icon big" onclick="load()" aria-label="새로고침">↻</button>
        <button class="icon" onclick="logout()">나가기</button>
      </div>
      <div class="tabs">
        <button class="tab on" data-tab="todo" onclick="setTab('todo')">미확인 <span class="n" id="n-todo">0</span></button>
        <button class="tab" data-tab="done" onclick="setTab('done')">확인됨 <span class="n" id="n-done">0</span></button>
        <button class="tab" data-tab="all" onclick="setTab('all')">전체 <span class="n" id="n-all">0</span></button>
      </div>
      <input id="q" type="search" placeholder="이름, 주소, 전화번호, 비고 아무거나 찾기" oninput="render()">
    </div>
  </header>
  <div class="wrap"><div class="stats" id="stats"></div></div>
  <div class="wrap btnrow"><button class="dl" id="dlBtn" onclick="downloadAll()">📥 (받기) 전체리스트</button><button class="dl" onclick="startBoard()">📺 알림판</button></div>
  <div class="wrap" id="list"><p class="empty">불러오는 중…</p></div>
</div>

<!-- 알림판 -->
<div id="board" class="hide">
  <div class="btop">
    <h1>🍑 새 주문 알림판</h1>
    <span class="clock" id="bClock"></span>
    <button class="icon" onclick="stopBoard()">목록으로</button>
  </div>
  <div class="bwrap">
    <div class="bcount"><span class="num" id="bNum">0</span><span class="unit">건 미확인</span><span class="sub" id="bBoxes"></span></div>
    <div id="bNew"></div>
    <div class="bgrid" id="bList"></div>
    <p class="bfoot" id="bFoot"></p>
  </div>
</div>

<!-- 상세 -->
<div id="detail" class="hide">
  <header>
    <div class="wrap" style="display:flex;align-items:center;gap:10px;width:100%">
      <button class="icon" onclick="closeDetail()">← 목록</button>
      <h2 id="dTitle"></h2>
    </div>
  </header>
  <div class="wrap" id="dBody"></div>
  <div class="actbar" id="dActBar"><div class="inner" id="dAct"></div></div>
</div>

<div id="toast"></div>

<script>
  var K_TOKEN = 'peachAdminToken', K_BOARD = 'peachAdminBoard';
  var state = { token: '', taker: '', edit: null, editor: '', groups: [], tab: 'todo', open: null, busy: false };

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtPhone(p) {
    var d = String(p || '').replace(/[^0-9]/g, '');
    if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    return p || '';
  }
  function telLink(p) {
    var d = String(p || '').replace(/[^0-9]/g, '');
    if (!d) return '<span class="miss">없음</span>';
    return '<a class="tel" href="tel:' + d + '">' + esc(fmtPhone(p)) + '</a>';
  }
  function splitNote(note) {
    var mail = '', m = String(note || '').match(/\[메일:([^\]]*)\]/);
    if (m) mail = m[1];
    var miss = '', m2 = String(note || '').match(/\[미비:([^\]]*)\]/);
    if (m2) miss = m2[1];
    var text = String(note || '').replace(/\[메일:[^\]]*\]/g, '').replace(/\[미비:[^\]]*\]/g, '').trim();
    return { text: text, mail: mail, miss: miss };
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function show(id) {
    ['login', 'main', 'board'].forEach(function (x) { document.getElementById(x).classList.toggle('hide', x !== id); });
  }

  function call(fn, args, ok, fail) {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function (e) {
        var msg = (e && e.message) || String(e);
        if (msg.indexOf('AUTH') !== -1) { logout(); document.getElementById('loginErr').textContent = '다시 로그인해주세요.'; return; }
        (fail || function (m) { toast(m); })(msg);
      })[fn].apply(null, args);
  }

  /* ── 알림판 (태블릿을 켜 두는 용도) ── */
  var board = { on: false, timer: null, clock: null, known: null, fresh: {}, newCount: 0, lastAt: '', ctx: null, wake: null };
  var POLL_MS = 30000;

  function audioCtx() {
    try {
      if (!board.ctx) board.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (board.ctx.state === 'suspended') board.ctx.resume();
    } catch (e) {}
    return board.ctx;
  }
  function beep() {
    var c = audioCtx(); if (!c || c.state !== 'running') return false;
    [[880, 0], [660, 0.32], [880, 0.64]].forEach(function (n) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = n[0]; o.connect(g); g.connect(c.destination);
      var t = c.currentTime + n[1];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.start(t); o.stop(t + 0.3);
    });
    return true;
  }
  function keepAwake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (l) { board.wake = l; }, function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (board.on && !document.hidden) { keepAwake(); load(); }
  });
  // 화면을 한 번이라도 누르면 소리가 켜진다 (브라우저 규칙)
  document.addEventListener('pointerdown', function () { if (board.on) audioCtx(); });

  function startBoard() {
    board.on = true; board.known = null; board.fresh = {}; board.newCount = 0;
    store(K_BOARD, '1');
    audioCtx(); keepAwake();
    show('board');
    clearInterval(board.timer); board.timer = setInterval(load, POLL_MS);
    clearInterval(board.clock); board.clock = setInterval(boardClock, 1000); boardClock();
    boardRender();
    if (state.token) load();
  }
  function stopBoard() {
    board.on = false; store(K_BOARD, null);
    clearInterval(board.timer); clearInterval(board.clock);
    try { if (board.wake) board.wake.release(); } catch (e) {}
    board.wake = null;
    show('main');
  }
  function boardClock() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    document.getElementById('bClock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  // 새로 불러올 때마다: 처음 보는 미확인 묶음이 있으면 소리 + 큰 배너
  function boardUpdate() {
    if (!board.on) return;
    var todo = state.groups.filter(function (g) { return !g.checked; });
    var keys = {}; todo.forEach(function (g) { keys[g.key] = true; });
    if (board.known) {
      var added = todo.filter(function (g) { return !board.known[g.key]; });
      if (added.length) {
        added.forEach(function (g) { board.fresh[g.key] = true; });
        board.newCount += added.length;
        beep();
      }
    }
    board.known = keys;
    Object.keys(board.fresh).forEach(function (k) { if (!keys[k]) delete board.fresh[k]; });
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    board.lastAt = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    boardRender();
  }
  function boardRender() {
    var todo = state.groups.filter(function (g) { return !g.checked; });
    var boxes = todo.reduce(function (s, g) { return s + (g.boxes || 0); }, 0);
    document.getElementById('bNum').textContent = todo.length;
    document.getElementById('bBoxes').textContent = todo.length ? '총 ' + boxes + '박스' : '';
    var nb = document.getElementById('bNew'), fresh = Object.keys(board.fresh).length;
    nb.style.display = fresh ? 'block' : 'none';
    nb.textContent = fresh ? '🔔 새 주문 ' + fresh + '건이 들어왔어요!' : '';
    document.getElementById('bList').innerHTML = todo.length ? todo.map(function (g) {
      var first = g.items[0] ? g.items[0].name : '';
      var more = g.items.length > 1 ? ' 외 ' + (g.items.length - 1) + '명' : '';
      var cls = 'bcard' + (board.fresh[g.key] ? ' fresh' : '') + (g.warn ? ' warn' : '');
      var pills = (board.fresh[g.key] ? '<span class="pill p-new">NEW</span>' : '') +
        (g.warn ? '<span class="pill p-warn">빠진 칸</span>' : '') + (g.mail ? '<span class="pill p-mail">메일</span>' : '');
      return '<button class="' + cls + '" onclick="openDetail(\'' + encodeURIComponent(g.key) + '\')">' +
        '<div class="b1"><span class="bs">' + esc(g.sender || '(보내는분 없음)') + '</span><span class="bq">' + (g.boxes ? g.boxes + '박스' : '박스 ?') + '</span></div>' +
        '<div class="b2">→ ' + esc(first) + esc(more) + '</div>' +
        '<div class="b3">' + pills + '<span>' + esc(g.time) + '</span></div></button>';
    }).join('') : '';
    if (!todo.length) document.getElementById('bList').innerHTML = '<div class="bempty" style="grid-column:1/-1">새로 확인할 주문이 없어요 👍</div>';
    var snd = board.ctx && board.ctx.state === 'running' ? '🔊 소리 켜짐' : '🔇 화면을 한 번 누르면 소리가 켜져요';
    document.getElementById('bFoot').textContent = '30초마다 자동으로 새로 불러와요 · 마지막 확인 ' + (board.lastAt || '-') + ' · ' + snd;
  }

  /* ── 전체리스트 엑셀 받기 (주문접수 탭만) ── */
  var XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  function loadXlsx(cb, fail) {
    if (window.XLSX) return cb();
    var s = document.createElement('script');
    s.src = XLSX_SRC; s.onload = cb; s.onerror = function () { fail('엑셀 도구를 불러오지 못했어요. 인터넷을 확인해주세요.'); };
    document.head.appendChild(s);
  }
  function downloadAll() {
    var btn = document.getElementById('dlBtn');
    btn.disabled = true; btn.textContent = '준비 중…';
    function done() { btn.disabled = false; btn.textContent = '📥 (받기) 전체리스트'; }
    function fail(m) { done(); toast(m); }
    call('adminExport', [state.token], function (res) {
      var rows = (res && res.rows) || [];
      if (rows.length < 2) { fail('받을 주문이 없어요.'); return; }
      loadXlsx(function () {
        try {
          var ws = XLSX.utils.aoa_to_sheet(rows);
          ws['!cols'] = [18, 12, 15, 6, 44, 12, 15, 30, 10, 10, 18].map(function (w) { return { wch: w }; });
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, '주문접수');
          var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
          var fname = 'peach_orders_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.xlsx';
          var blob = new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })],
            { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          var url = URL.createObjectURL(blob), a = document.createElement('a');
          a.href = url; a.download = fname; document.body.appendChild(a); a.click();
          setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
          done(); toast('엑셀을 받았어요 (' + (rows.length - 1) + '줄)');
        } catch (e) { fail('엑셀을 만들지 못했어요: ' + e.message); }
      }, fail);
    }, fail);
  }

  /* ── 로그인 ── */
  function doLogin() {
    var pw = document.getElementById('pw').value;
    var err = document.getElementById('loginErr'), btn = document.getElementById('loginBtn');
    err.textContent = '';
    if (!pw) { err.textContent = '비밀번호를 적어주세요.'; return; }
    btn.disabled = true;
    call('adminLogin', [pw], function (res) {
      btn.disabled = false;
      state.token = res.token;
      store(K_TOKEN, res.token);
      document.getElementById('pw').value = '';
      enter();
    }, function (m) { btn.disabled = false; err.textContent = m; });
  }
  function logout() {
    state.token = ''; store(K_TOKEN, null);
    board.on = false; clearInterval(board.timer); clearInterval(board.clock);   // 알림판 설정은 남겨 두어 다시 로그인하면 알림판으로 돌아온다
    closeDetail();
    show('login');
  }
  function enter() {
    if (recall(K_BOARD) === '1') startBoard(); else show('main');
    load();
  }

  /* ── 현황 카드 (총계 + 일별 박스 스파크라인) ── */
  function dayKey(t) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(t || '')); return m ? m[1] + '-' + m[2] + '-' + m[3] : ''; }
  function dayAdd(k, n) { var d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dayLabel(k) { return k.slice(5, 7) + '/' + k.slice(8, 10); }
  var spDays = [];
  function renderStats() {
    var G = state.groups, boxes = 0, todo = 0, byDay = {}, ordersByDay = {};
    G.forEach(function (g) {
      boxes += g.boxes || 0; if (!g.checked) todo++;
      var k = dayKey(g.time); if (!k) return;
      byDay[k] = (byDay[k] || 0) + (g.boxes || 0); ordersByDay[k] = (ordersByDay[k] || 0) + 1;
    });
    var d0 = new Date(), today = d0.getFullYear() + '-' + ('0' + (d0.getMonth() + 1)).slice(-2) + '-' + ('0' + d0.getDate()).slice(-2);
    var keys = Object.keys(byDay).sort(), first = keys.length ? keys[0] : today;
    if (first < dayAdd(today, -29)) first = dayAdd(today, -29);
    spDays = [];
    for (var k = first, guard = 0; k <= today && guard < 40; k = dayAdd(k, 1), guard++) spDays.push({ k: k, v: byDay[k] || 0, n: ordersByDay[k] || 0 });
    var tile = function (cls, v, unit, label) { return '<div class="tile ' + cls + '"><div class="v">' + v + '<small>' + unit + '</small></div><div class="k">' + label + '</div></div>'; };
    var html = '<div class="tiles"><div class="grp">' + tile('', G.length, '건', '총 주문') + tile('todo', todo, '건', '미확인') +
      tile('', G.length - todo, '건', '확인') + '</div><div class="grp r">' + tile('', byDay[today] || 0, '박스', '오늘 박스') +
      tile('', boxes, '박스', '총 박스') + '</div></div>';
    var n = spDays.length, W = 300, H = 56, P = 6, max = 1;
    spDays.forEach(function (d) { if (d.v > max) max = d.v; });
    var X = function (i) { return n < 2 ? W / 2 : P + i * (W - 2 * P) / (n - 1); };
    var Y = function (v) { return H - P - v / max * (H - 2 * P); };
    var pts = spDays.map(function (d, i) { return X(i).toFixed(1) + ',' + Y(d.v).toFixed(1); });
    var last = spDays[n - 1];
    html += '<div class="sp"><div class="hd">일별 박스 <span>(최근 ' + n + '일)</span><span class="now" id="spNow">오늘 ' + last.v + '박스</span></div>' +
      '<svg id="spSvg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="일별 박스 수 추이">' +
      '<line class="base" x1="0" y1="' + (H - P) + '" x2="' + W + '" y2="' + (H - P) + '"/>' +
      (n > 1 ? '<polygon class="area" points="' + X(0).toFixed(1) + ',' + (H - P) + ' ' + pts.join(' ') + ' ' + X(n - 1).toFixed(1) + ',' + (H - P) + '"/>' +
               '<polyline class="ln" points="' + pts.join(' ') + '"/>' : '') +
      '<line class="rule" id="spRule" x1="0" y1="0" x2="0" y2="' + H + '"/>' +
      '<circle class="dot" id="spDot" cx="' + X(n - 1).toFixed(1) + '" cy="' + Y(last.v).toFixed(1) + '" r="4"/></svg>' +
      '<div class="ends"><span>' + dayLabel(spDays[0].k) + '</span><span>오늘</span></div>' +
      '<details><summary>표로 보기</summary><table><tr><th>날짜</th><th>주문</th><th>박스</th></tr>' +
      spDays.slice().reverse().map(function (d) { return '<tr><td>' + dayLabel(d.k) + '</td><td>' + d.n + '건</td><td>' + d.v + '</td></tr>'; }).join('') +
      '</table></details></div>';
    document.getElementById('stats').innerHTML = html;
    var svg = document.getElementById('spSvg'), dot = document.getElementById('spDot'), rule = document.getElementById('spRule'), now = document.getElementById('spNow');
    function at(ev) {
      var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
      var i = n < 2 ? 0 : Math.max(0, Math.min(n - 1, Math.round((x - P) / ((W - 2 * P) / (n - 1)))));
      var d = spDays[i];
      dot.setAttribute('cx', X(i).toFixed(1)); dot.setAttribute('cy', Y(d.v).toFixed(1));
      rule.setAttribute('x1', X(i).toFixed(1)); rule.setAttribute('x2', X(i).toFixed(1)); rule.style.opacity = 1;
      now.textContent = dayLabel(d.k) + ' · ' + d.v + '박스 (' + d.n + '건)';
    }
    function reset() {
      dot.setAttribute('cx', X(n - 1).toFixed(1)); dot.setAttribute('cy', Y(last.v).toFixed(1)); rule.style.opacity = 0;
      now.textContent = '오늘 ' + last.v + '박스';
    }
    svg.addEventListener('pointermove', at); svg.addEventListener('pointerdown', at);
    svg.addEventListener('pointerleave', reset);
  }

  /* ── 목록 ── */
  function load() {
    call('adminList', [state.token], function (res) {
      state.groups = res.groups || [];
      render();
      renderStats();
      boardUpdate();
      if (state.open) {   // 상세 열려 있으면 최신 내용으로 다시 그림
        var g = findGroup(state.open);
        if (g) { if (!state.edit) renderDetail(g); } else closeDetail();
      }
    }, function (m) {
      document.getElementById('list').innerHTML = '<p class="empty">' + esc(m) + '</p>';
    });
  }
  function setTab(t) {
    state.tab = t;
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
    render();
  }
  function matches(g, q) {
    if (!q) return true;
    var qd = q.replace(/[^0-9]/g, '');
    // 이름·주소·비고·상태·확인자·수량 등 화면에 있는 글자는 전부 검색 대상 (대소문자·띄어쓰기 무시)
    var squash = function (t) { return String(t || '').toLowerCase().replace(/\s+/g, ''); };
    var hay = [g.sender, g.senderPhone, g.time, g.by].concat(g.items.map(function (i) {
      return [i.name, i.phone, i.addr, i.note, i.status, i.qty, i.by].join(' ');
    })).join(' ');
    if (squash(hay).indexOf(squash(q)) !== -1) return true;
    if (qd.length >= 3) {
      var phones = [g.senderPhone].concat(g.items.map(function (i) { return i.phone; })).join(' ').replace(/[^0-9 ]/g, '');
      if (phones.indexOf(qd) !== -1) return true;
    }
    return false;
  }
  function render() {
    var q = document.getElementById('q').value.trim();
    var all = state.groups;
    document.getElementById('n-todo').textContent = all.filter(function (g) { return !g.checked; }).length;
    document.getElementById('n-done').textContent = all.filter(function (g) { return g.checked; }).length;
    document.getElementById('n-all').textContent = all.length;

    var list = all.filter(function (g) {
      if (state.tab === 'todo' && g.checked) return false;
      if (state.tab === 'done' && !g.checked) return false;
      return matches(g, q);
    });
    var el = document.getElementById('list');
    if (!list.length) {
      el.innerHTML = '<p class="empty">' + (q ? '찾는 주문이 없어요' : state.tab === 'todo' ? '새로 확인할 주문이 없어요 👍' : '주문이 없어요') + '</p>';
      return;
    }
    el.innerHTML = list.map(function (g) {
      var first = g.items[0] ? g.items[0].name : '';
      var more = g.items.length > 1 ? ' 외 ' + (g.items.length - 1) + '명' : '';
      var cls = 'card' + (g.checked ? ' checked' : g.warn ? ' warn' : '');
      var pills = g.checked
        ? '<span class="pill p-ok">✓ ' + esc(g.by || (g.sheet1 ? '시트1 기록됨' : '확인')) + '</span>'
        : '<span class="pill p-new">미확인</span>';
      if (g.warn && !g.checked) pills += '<span class="pill p-warn">빠진 칸</span>';
      if (g.mail) pills += '<span class="pill p-mail">메일</span>';
      if (g.memo) pills += '<span class="pill p-mail">📝 메모</span>';
      return '<button class="' + cls + '" onclick="openDetail(\'' + encodeURIComponent(g.key) + '\')">' +
        '<div class="l1"><span class="sender">' + esc(g.sender || '(보내는분 없음)') + '</span>' +
        '<span class="boxes">' + (g.boxes ? g.boxes + '박스' : '박스 ?') + '</span></div>' +
        '<div class="l2">→ ' + esc(first) + esc(more) + '</div>' +
        '<div class="l3">' + pills + '<span>' + esc(g.time) + '</span></div>' +
        '</button>';
    }).join('');
  }

  /* ── 상세 ── */
  function findGroup(key) {
    for (var i = 0; i < state.groups.length; i++) if (state.groups[i].key === key) return state.groups[i];
    return null;
  }
  function openDetail(enc) {
    var g = findGroup(decodeURIComponent(enc));
    if (!g) return;
    state.open = g.key; state.taker = ''; state.edit = null; state.editor = '';
    if (board.fresh[g.key]) { delete board.fresh[g.key]; boardRender(); }
    renderDetail(g);
    var d = document.getElementById('detail');
    d.classList.remove('hide'); d.scrollTop = 0;
  }
  function closeDetail() {
    state.open = null; state.edit = null;
    document.getElementById('detail').classList.add('hide');
  }
  function fld(label, id, val, extra) {
    return '<label for="' + id + '">' + label + '</label><input id="' + id + '" value="' + esc(val) + '" ' + (extra || '') + '>';
  }
  function editorChips() {
    return '<label>누가 고쳤어요?</label><div class="who-pick" id="editorPick">' + TAKERS.map(function (n) {
      return '<button type="button" class="chip' + (state.editor === n ? ' on' : '') + '" onclick="pickEditor(\'' + n + '\')">' + n + '</button>';
    }).join('') + '</div>';
  }
  function editBtns() {
    return '<div class="btns"><button class="ghost" onclick="cancelEdit()">취소</button>' +
      '<button class="primary" id="saveBtn" onclick="saveEdit()">저장</button></div>';
  }
  function renderDetail(g) {
    document.getElementById('dTitle').textContent = (g.sender || '주문') + ' · ' + g.boxes + '박스';
    var ed = state.edit, mail = '', html = '';
    g.items.forEach(function (it) { var n = splitNote(it.note); if (n.mail) mail = n.mail; });

    html += '<div class="sec">보내는 분</div>';
    if (ed && ed.kind === 'sender') {
      html += '<div class="rc eform">' + fld('성함', 'e_sname', g.sender) +
        fld('연락처 (숫자 11자리)', 'e_sphone', g.senderPhone, 'inputmode="numeric" maxlength="13"') +
        editorChips() + editBtns() + '</div>';
    } else {
      html += '<div class="rc">' +
        '<div class="nm">' + esc(g.sender || '') + (g.sender ? '' : '<span class="miss">없음</span>') +
        (g.checked ? '' : '<button class="mini" onclick="startEdit(\'sender\')">✏️ 수정</button>') + '</div>' +
        '<div class="row"><span class="k">전화</span><span class="v">' + telLink(g.senderPhone) + '</span></div>' +
        '<div class="meta">접수 ' + esc(g.time) + '</div>' +
        (mail ? '<div class="meta">메일로 접수 · ' + esc(mail) + '</div>' : '') + '</div>';
    }

    html += '<div class="sec">받는 분 ' + g.items.length + '명</div>';
    g.items.forEach(function (it, i) {
      var n = splitNote(it.note);
      if (ed && ed.kind === 'row' && ed.i === i) {
        html += '<div class="rc eform">' + fld('받는 분 성함', 'e_name', it.name) +
          fld('연락처 (숫자 11자리)', 'e_phone', it.phone, 'inputmode="numeric" maxlength="13"') +
          fld('수량 (박스)', 'e_qty', it.qty, 'inputmode="numeric"') +
          fld('주소', 'e_addr', it.addr) + fld('비고', 'e_note', n.text) +
          editorChips() + editBtns() + '</div>';
        return;
      }
      var warn = it.status === '확인필요' || !!n.miss;
      html += '<div class="rc' + (warn ? ' warn' : '') + '">' +
        '<div class="nm">' + (g.items.length > 1 ? (i + 1) + '. ' : '') + esc(it.name) +
        '<span class="q">' + (it.qty ? esc(it.qty) + '박스' : '<span class="miss">수량 없음</span>') + '</span>' +
        (g.checked ? '' : '<button class="mini" style="margin-left:8px" onclick="startEdit(\'row\',' + i + ')">✏️ 수정</button>') + '</div>' +
        '<div class="row"><span class="k">전화</span><span class="v">' + telLink(it.phone) + '</span></div>' +
        '<div class="row"><span class="k">주소</span><span class="v">' + (it.addr ? esc(it.addr) : '<span class="miss">없음</span>') + '</span></div>' +
        (n.text ? '<div class="row"><span class="k">비고</span><span class="v">' + esc(n.text) + '</span></div>' : '') +
        (n.miss ? '<div class="notice">빠진 칸: ' + esc(n.miss) + '</div>' : '') +
        (it.status === '완료' ? '<div class="meta">시트1에 기록됨</div>' : '') +
        '</div>';
    });

    html += '<div class="sec">메모</div>';
    if (ed && ed.kind === 'memo') {
      html += '<div class="rc eform"><textarea id="e_memo" placeholder="예) 엄마가 전화 통화함, 주소 다시 확인해야 함">' + esc(g.memo) + '</textarea>' +
        editorChips() + editBtns() + '</div>';
    } else {
      html += '<div class="rc"><div class="nm"><span style="font-weight:600;font-size:.9rem;color:var(--soft)">주문 전체에 대한 메모</span>' +
        '<button class="mini" onclick="startEdit(\'memo\')">✏️ ' + (g.memo ? '수정' : '메모 쓰기') + '</button></div>' +
        '<div class="memo' + (g.memo ? '' : ' empty') + '">' + (g.memo ? esc(g.memo) : '아직 메모가 없어요') + '</div>' +
        (g.log ? '<details class="log"><summary>수정 기록 보기</summary><pre>' + esc(g.log) + '</pre></details>' : '') + '</div>';
    }
    document.getElementById('dBody').innerHTML = html;
    document.getElementById('dActBar').classList.toggle('hide', !!ed);

    var act = document.getElementById('dAct');
    if (g.checked) {
      act.innerHTML = '<div class="okline"><div class="txt">✓ 확인됨' +
        '<small>' + (g.by ? esc(g.by) + '한테 온 주문' : '') + (g.at ? ' · ' + esc(g.at) : '') + '</small></div>' +
        (g.sheet1 ? '' : '<button class="ghost" onclick="unconfirm()">확인 취소</button>') + '</div>';
    } else {
      act.innerHTML = '<div class="tk-label">누구한테 들어온 주문이에요?</div>' +
        '<div class="who-pick" id="takerPick">' + TAKERS.map(function (n) {
          return '<button type="button" class="chip' + (state.taker === n ? ' on' : '') + '" onclick="pickTaker(\'' + n + '\')">' + n + '</button>';
        }).join('') + '</div>' +
        '<button class="primary" id="okBtn" onclick="confirmOrder()"' + (state.taker ? '' : ' disabled') + '>' +
        (state.taker ? '✓ ' + state.taker + '한테 온 주문, 확인' : '위에서 먼저 눌러주세요') + '</button>';
    }
  }
  var TAKERS = ['아빠', '엄마', '종원', '지은', '명석'];
  function pickTaker(n) {
    state.taker = n;
    var g = findGroup(state.open); if (g) renderDetail(g);
  }
  function startEdit(kind, i) {
    state.edit = { kind: kind, i: i == null ? -1 : i };
    var g = findGroup(state.open); if (g) renderDetail(g);
    var f = document.querySelector('#dBody .eform input, #dBody .eform textarea'); if (f) f.focus();
  }
  function cancelEdit() {
    state.edit = null;
    var g = findGroup(state.open); if (g) renderDetail(g);
  }
  function pickEditor(n) {
    state.editor = n;
    document.querySelectorAll('#editorPick .chip').forEach(function (c) { c.classList.toggle('on', c.textContent === n); });
  }
  function saveEdit() {
    var g = findGroup(state.open), ed = state.edit; if (!g || !ed || state.busy) return;
    if (!state.editor) { toast('누가 고쳤는지 먼저 눌러주세요'); return; }
    var val = function (id) { return document.getElementById(id).value; };
    var edits = [], newKey = null;
    if (ed.kind === 'sender') {
      g.items.forEach(function (it) { edits.push({ row: it.row, sig: it.sig, sname: val('e_sname'), sphone: val('e_sphone') }); });
      newKey = [g.time, val('e_sname').trim(), val('e_sphone').replace(/[^0-9]/g, '')].join('|');
    } else if (ed.kind === 'row') {
      var it = g.items[ed.i];
      edits.push({ row: it.row, sig: it.sig, name: val('e_name'), phone: val('e_phone'), qty: val('e_qty'), addr: val('e_addr'), note: val('e_note') });
    } else {
      var f = g.items[0];
      edits.push({ row: f.row, sig: f.sig, memo: val('e_memo') });
    }
    state.busy = true;
    var b = document.getElementById('saveBtn'); if (b) { b.disabled = true; b.textContent = '저장 중…'; }
    call('adminEdit', [state.token, edits, state.editor], function (res) {
      state.busy = false; state.edit = null;
      if (newKey && res.updated) state.open = newKey;
      toast(res.skipped ? '시트가 바뀐 줄이 있어 새로 불러왔어요' : res.updated ? '저장했어요' : '바뀐 내용이 없어요');
      load();
    }, function (m) { state.busy = false; toast(m); if (b) { b.disabled = false; b.textContent = '저장'; } });
  }
  function pickItems(g) { return g.items.map(function (it) { return { row: it.row, sig: it.sig }; }); }
  function confirmOrder() {
    var g = findGroup(state.open); if (!g || state.busy) return;
    if (!state.taker) { toast('누구한테 들어온 주문인지 먼저 눌러주세요'); return; }
    state.busy = true;
    var b = document.getElementById('okBtn'); if (b) { b.disabled = true; b.textContent = '저장 중…'; }
    call('adminConfirm', [state.token, pickItems(g), state.taker], function (res) {
      state.busy = false;
      toast(res.skipped ? '시트가 바뀐 줄이 있어 새로 불러왔어요' : '확인했어요');
      closeDetail(); load();
    }, function (m) { state.busy = false; toast(m); if (b) { b.disabled = false; b.textContent = '✓ ' + state.taker + '한테 온 주문, 확인'; } });
  }
  function unconfirm() {
    var g = findGroup(state.open); if (!g || state.busy) return;
    if (!confirm('확인을 취소할까요?')) return;
    state.busy = true;
    call('adminUnconfirm', [state.token, pickItems(g)], function () {
      state.busy = false; toast('확인을 취소했어요'); load();
    }, function (m) { state.busy = false; toast(m); });
  }

  /* ── 시작 ── */
  document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.token) load(); });
  state.token = recall(K_TOKEN);
  if (state.token) enter(); else show('login');
</script>
</body>
</html>
