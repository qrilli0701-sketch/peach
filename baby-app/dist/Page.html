<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>우리 아이</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     iOS 디자인 시스템 토큰.
     색·간격·둥글기·글자 크기를 Apple Human Interface Guidelines 의
     시스템 값에 맞춘다. 임의의 색을 쓰지 않는 게 '애플 감성'의 8할이다.
     ───────────────────────────────────────────────────────────── */
  :root{
    /* 배경 — 그룹 리스트 화면 기준 */
    --bg:#f2f2f7;             /* systemGroupedBackground */
    --card:#ffffff;           /* secondarySystemGroupedBackground */
    --fill:rgba(120,120,128,.12);   /* tertiarySystemFill */
    --fill-2:rgba(120,120,128,.08);
    /* 글자 */
    --label:#000000;
    --label-2:rgba(60,60,67,.6);    /* secondaryLabel */
    --label-3:rgba(60,60,67,.3);    /* tertiaryLabel */
    /* 구분선 — 항상 hairline */
    --sep:rgba(60,60,67,.29);
    /* 시스템 컬러 */
    --blue:#007aff; --red:#ff3b30; --green:#34c759;
    --orange:#ff9500; --gray:#8e8e93;
    --seg-on:#ffffff;
    --sheet:#f2f2f7;
    --blur:saturate(180%) blur(20px);
    --bar:rgba(249,249,249,.82);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --card:#1c1c1e;
      --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.18);
      --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
      --sep:rgba(84,84,88,.65);
      --blue:#0a84ff; --red:#ff453a; --green:#30d158;
      --orange:#ff9f0a; --gray:#8e8e93;
      --seg-on:#636366;
      --sheet:#1c1c1e;
      --bar:rgba(30,30,30,.82);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--label);
    font:17px/1.294 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",
         "Pretendard","Malgun Gothic",sans-serif;
    letter-spacing:-.022em;
    padding-bottom:calc(50px + env(safe-area-inset-bottom) + 8px);
    overscroll-behavior-y:none;
  }
  .wrap{max-width:560px;margin:0 auto}

  /* ── 네비게이션 바 (라지 타이틀) ───────────────────── */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    padding-top:env(safe-area-inset-top);
    transition:box-shadow .2s;
  }
  header.scrolled{box-shadow:0 .5px 0 var(--sep)}
  .navbar{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px}
  .navbar .spacer{flex:1}
  .nav-action{
    background:none;border:none;color:var(--blue);font:17px/1 inherit;letter-spacing:-.022em;
    padding:8px 0;cursor:pointer;font-family:inherit;
  }
  .nav-action:active{opacity:.35}
  .large-title{padding:0 16px 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .large-title h1{
    font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0;
  }
  .large-title .sub{font-size:15px;color:var(--label-2);letter-spacing:-.01em}
  /* 아이 전환 — 이름을 탭하면 열리는 네이티브 선택기 */
  .kid-pick{position:relative;display:inline-flex;align-items:baseline}
  .kid-pick select{
    position:absolute;inset:0;width:100%;height:100%;opacity:0;
    -webkit-appearance:none;appearance:none;border:none;font-size:16px;
  }
  .kid-pick .caret{font-size:17px;color:var(--label-3);margin-left:2px}

  /* ── 섹션 헤더 ─────────────────────────────────────── */
  .sec{
    font-size:13px;line-height:18px;color:var(--label-2);font-weight:400;
    letter-spacing:-.078px;margin:28px 16px 7px;display:flex;align-items:center;gap:6px;
  }
  .sec .n{color:var(--label-3)}
  .sec:first-child{margin-top:16px}

  /* ── 인셋 그룹 리스트 ──────────────────────────────── */
  .list{
    background:var(--card);border-radius:var(--radius);margin:0 16px 0;overflow:hidden;
  }
  .list + .sec{margin-top:28px}
  .row{
    display:flex;align-items:center;gap:12px;
    padding:11px 16px;min-height:44px;position:relative;
    background:var(--card);
  }
  /* 헤어라인 구분선 — 마지막 행 제외, 왼쪽 들여쓰기 */
  .row + .row::before{
    content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep);
  }
  .row.inset + .row::before{left:56px}
  .row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .row .t{display:block;font-size:17px;line-height:22px}
  .row .d{display:block;font-size:13px;line-height:18px;color:var(--label-2)}
  .row .val{font-size:17px;color:var(--label-2);white-space:nowrap}
  .row .chev{color:var(--label-3);font-size:17px;flex:none}
  .row .emoji{font-size:24px;line-height:28px;width:28px;text-align:center;flex:none}
  a.row,button.row{
    width:100%;text-align:left;border:none;font-family:inherit;color:inherit;cursor:pointer;
  }
  a.row:active,button.row:active,.row.tappable:active{background:var(--fill-2)}
  .row.done .t{color:var(--label-2)}

  /* 상태 배지 */
  .badge{
    font-size:13px;font-weight:600;line-height:18px;padding:2px 8px;border-radius:999px;
    background:var(--fill);color:var(--label-2);white-space:nowrap;flex:none;
    letter-spacing:-.01em;
  }
  .badge.red{background:rgba(255,59,48,.14);color:var(--red)}
  .badge.green{background:rgba(52,199,89,.16);color:var(--green)}
  .badge.orange{background:rgba(255,149,0,.16);color:var(--orange)}

  /* ── 버튼 ──────────────────────────────────────────── */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:12px;padding:14px 18px;cursor:pointer;
    font:600 17px/22px inherit;letter-spacing:-.022em;font-family:inherit;
    background:var(--blue);color:#fff;transition:opacity .12s,transform .12s;
  }
  .btn:active{opacity:.82;transform:scale(.98)}
  .btn.tinted{background:var(--fill);color:var(--blue)}
  .btn.plain{background:none;color:var(--blue);padding:14px 8px}
  .btn.small{padding:7px 14px;font-size:15px;border-radius:999px}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.4}
  .btn-row{display:flex;gap:10px;margin:16px}

  /* ── 세그먼티드 컨트롤 ─────────────────────────────── */
  .seg{
    display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:12px 16px;
    position:relative;
  }
  .seg button{
    flex:1;border:none;background:none;border-radius:7px;padding:6px 8px;cursor:pointer;
    font:500 13px/18px inherit;color:var(--label);font-family:inherit;letter-spacing:-.01em;
    white-space:nowrap;transition:background .18s;
  }
  .seg button.on{
    background:var(--seg-on);font-weight:600;
    box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  }

  /* ── 방문 카드 — 이 앱의 주인공 ──────────────────── */
  .visit{
    background:var(--card);border-radius:14px;margin:0 16px;overflow:hidden;
  }
  .visit.urgent{box-shadow:0 0 0 2px var(--red) inset}
  .visit-head{padding:18px 18px 14px}
  .visit-when{font-size:13px;line-height:18px;color:var(--label-2);letter-spacing:-.01em}
  .visit-date{font-size:30px;line-height:36px;font-weight:700;letter-spacing:.3px;margin:2px 0 6px}
  .visit-sum{font-size:17px;line-height:22px;font-weight:600;color:var(--blue)}
  .visit.urgent .visit-sum{color:var(--red)}
  .visit-why{font-size:13px;line-height:18px;color:var(--label-2);margin-top:4px}
  .visit-items{padding:0 18px 4px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:13px;line-height:18px;padding:5px 10px;border-radius:999px;
    background:var(--fill);color:var(--label);white-space:nowrap;
  }
  .chip.free{background:rgba(52,199,89,.16);color:var(--green)}
  .chip.late{background:rgba(255,59,48,.14);color:var(--red)}
  .visit-acts{display:flex;gap:10px;padding:14px 18px 18px}
  .visit-acts .btn{flex:1;padding:12px 10px;font-size:15px}
  .visit-next{
    padding:12px 18px;font-size:13px;line-height:18px;color:var(--label-2);
    position:relative;background:var(--card);
  }
  .visit-next::before{
    content:'';position:absolute;left:18px;right:0;top:0;height:.5px;background:var(--sep);
  }

  /* ── 통계 타일 ─────────────────────────────────────── */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px}
  .tile{background:var(--card);border-radius:var(--radius);padding:14px 10px;text-align:center}
  .tile .k{font-size:13px;line-height:18px;color:var(--label-2)}
  .tile .v{font-size:26px;line-height:32px;font-weight:600;letter-spacing:.35px;margin-top:2px}
  .tile .v .u{font-size:13px;font-weight:400;color:var(--label-2);letter-spacing:0}
  .tile .p{font-size:13px;line-height:18px;color:var(--blue);font-weight:600;margin-top:1px}

  /* ── 빠른 기록 버튼 ────────────────────────────────── */
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px}
  .quick button{
    background:var(--card);border:none;border-radius:var(--radius);padding:16px 4px;
    cursor:pointer;font:400 13px/18px inherit;color:var(--label);font-family:inherit;
    transition:transform .12s,background .12s;
  }
  .quick button:active{background:var(--fill-2);transform:scale(.96)}
  .quick button .ic{display:block;font-size:26px;line-height:30px;margin-bottom:4px}

  /* ── 인라인 안내 ───────────────────────────────────── */
  .note{
    margin:0 16px;border-radius:var(--radius);padding:12px 14px;
    font-size:15px;line-height:20px;background:var(--card);color:var(--label-2);
  }
  .note.warn{background:rgba(255,149,0,.14);color:var(--orange)}
  .note.err{background:rgba(255,59,48,.12);color:var(--red)}
  .note b{color:var(--label)}
  .note.warn b,.note.err b{color:inherit}
  .note a{color:var(--blue);text-decoration:none}

  /* ── 폼 ────────────────────────────────────────────── */
  .field{padding:11px 16px;position:relative;background:var(--card)}
  .field + .field::before{
    content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep);
  }
  .field label{
    display:block;font-size:13px;line-height:18px;color:var(--label-2);margin-bottom:2px;
  }
  .field .pair{display:flex;gap:12px}
  .field .pair > div{flex:1;min-width:0}
  input,select,textarea{
    width:100%;border:none;background:none;color:var(--label);padding:0;
    font:17px/22px inherit;font-family:inherit;letter-spacing:-.022em;
    -webkit-appearance:none;appearance:none;
  }
  input[type=date],input[type=time]{min-height:22px}
  input::placeholder{color:var(--label-3)}
  input:focus,select:focus,textarea:focus{outline:none}
  select{background:none}
  /* iOS 스위치 — 네이티브 체크박스는 크기·색이 제각각이라 직접 그린다 */
  .check,.field label.check,.row label.check{
    display:flex;align-items:center;gap:12px;font-size:17px;line-height:22px;margin:0;
  }
  .check .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .check .txt .t{font-size:17px;line-height:22px}
  .check .txt .d{font-size:13px;line-height:18px;color:var(--label-2)}
  .switch{position:relative;width:51px;height:31px;flex:none}
  .switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:2;
                cursor:pointer;-webkit-appearance:none;appearance:none}
  .switch .track{position:absolute;inset:0;border-radius:31px;background:var(--fill);
                 transition:background .24s cubic-bezier(.32,.72,0,1)}
  .switch .knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
                background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);
                transition:transform .24s cubic-bezier(.32,.72,0,1)}
  .switch input:checked ~ .track{background:var(--green)}
  .switch input:checked ~ .knob{transform:translateX(20px)}

  /* ── 탭 바 ─────────────────────────────────────────── */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    box-shadow:0 -.5px 0 var(--sep);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;background:none;border:none;color:var(--gray);cursor:pointer;
    padding:6px 0 4px;font:500 10px/13px inherit;font-family:inherit;letter-spacing:.06px;
  }
  nav button .ic{display:block;margin:0 auto 2px;width:26px;height:26px}
  nav button .ic svg{width:26px;height:26px;display:block}
  nav button.on{color:var(--blue)}
  nav button.on .ic svg{stroke-width:2.1}

  /* ── 바텀 시트 ─────────────────────────────────────── */
  dialog{
    border:none;padding:0;margin:0;width:100%;height:100%;
    /* 크로미움의 dialog:modal 기본값이 max-height:calc(100% - 6px - 2em) 라
       그냥 두면 시트가 화면 바닥에서 40px 떠 있는다 */
    max-width:100%;max-height:100%;
    background:transparent;position:fixed;inset:0;
    display:flex;align-items:flex-end;justify-content:center;
  }
  dialog:not([open]){display:none}
  dialog::backdrop{background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .sheet{
    width:100%;max-width:560px;background:var(--sheet);border-radius:14px 14px 0 0;
    padding:8px 0 calc(16px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    animation:rise .32s cubic-bezier(.32,.72,0,1);
  }
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .grabber{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto 10px}
  .sheet h3{font-size:17px;font-weight:600;text-align:center;margin:0 16px 14px}

  /* ── 그래프 ────────────────────────────────────────── */
  .chart-card{background:var(--card);border-radius:var(--radius);margin:0 16px;padding:12px 6px 4px}
  .chart{width:100%;height:240px;display:block}
  .legend{
    display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--label-2);
    padding:6px 10px 8px;
  }
  .legend i{display:inline-block;width:14px;height:2px;border-radius:2px;
            background:var(--blue);vertical-align:middle;margin-right:5px}
  .legend .band i{background:var(--label-3);height:0;border-top:1.5px dashed var(--label-3)}

  /* ── 기타 ──────────────────────────────────────────── */
  .empty{color:var(--label-2);text-align:center;padding:56px 24px;font-size:15px;line-height:22px}
  .foot{color:var(--label-3);font-size:12px;line-height:18px;text-align:center;
        padding:28px 24px 12px}
  .foot a{color:var(--label-2)}
  .spin{
    display:inline-block;width:20px;height:20px;border:2px solid var(--fill);
    border-top-color:var(--label-3);border-radius:50%;animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%) translateY(8px);
    bottom:calc(60px + env(safe-area-inset-bottom));
    background:rgba(28,28,30,.92);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;
    z-index:60;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;max-width:88%;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap">
    <div class="navbar">
      <span class="spacer"></span>
      <button class="nav-action" onclick="openChildForm()">아이 설정</button>
    </div>
    <div class="large-title">
      <span class="kid-pick">
        <h1 id="kidName">우리 아이</h1>
        <select id="childSel" onchange="switchChild(this.value)" aria-label="아이 선택"></select>
      </span>
      <span class="caret" id="kidCaret"></span>
      <span class="sub" id="ageLabel"></span>
    </div>
  </div>
</header>

<main class="wrap" id="view"><div class="empty"><span class="spin"></span></div></main>

<nav>
  <button id="nav-today" class="on" onclick="go('today')"><span class="ic"><svg viewBox="0 0 26 26"
    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true"><path d="M4 11.2 13 4l9 7.2"/><path d="M6.3 10.2V20a1.5 1.5 0 0 0 1.5 1.5h10.4a1.5
    1.5 0 0 0 1.5-1.5v-9.8"/><path d="M10.6 21.5v-5.6h4.8v5.6"/></svg></span>오늘</button>
  <button id="nav-growth" onclick="go('growth')"><span class="ic"><svg viewBox="0 0 26 26"
    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true"><path d="M4 21.2h18"/><path d="M4 21.2V4.8"/><path d="M7.2 16.6l4.2-4.8 3.3 2.9
    5.1-6.4"/><circle cx="11.4" cy="11.8" r="1.5" fill="currentColor" stroke="none"/></svg></span>성장</button>
  <button id="nav-sched" onclick="go('sched')"><span class="ic"><svg viewBox="0 0 26 26"
    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true"><rect x="3.8" y="5.4" width="18.4" height="16.4" rx="3.2"/><path d="M3.8 10.3h18.4"/>
    <path d="M8.6 3.2v4"/><path d="M17.4 3.2v4"/><path d="M9.3 15.6l2.6 2.6 5-5"/></svg></span>일정</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>

<script>
/* ── 서버 호출 ────────────────────────────────────────── */
function call(action, payload){
  return new Promise(function(resolve, reject){
    google.script.run
      .withSuccessHandler(function(r){ r && r.ok ? resolve(r.data) : reject(new Error(r ? r.error : '응답 없음')); })
      .withFailureHandler(function(e){ reject(e); })
      .api(action, payload || {});
  });
}

var S = { children: [], childId: null, tab: 'today', who: '', today: '', cache: {} };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function view(html){ $('view').innerHTML = html; }
function busy(){ view('<div class="empty"><span class="spin"></span></div>'); }
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}
function fail(e){ view('<div class="banner err">'+esc(e.message||e)+'</div>'); }

/* ── 부팅 ────────────────────────────────────────────── */
call('bootstrap').then(function(d){
  S.children = d.children; S.who = d.who; S.today = d.today; S.comboNote = d.comboNote;
  if(!d.children.length){ renderChildForm(true); return; }
  S.childId = localStorage.getItem('childId') || d.children[0].id;
  if(!d.children.some(function(c){ return c.id===S.childId; })) S.childId = d.children[0].id;
  renderChildSelect(); go('today');
}).catch(fail);

function renderChildSelect(){
  var c = S.children.filter(function(x){ return x.id===S.childId; })[0] || S.children[0] || {};
  $('kidName').textContent = c.name || '우리 아이';
  $('kidCaret').textContent = S.children.length > 1 ? '⌄' : '';
  $('childSel').innerHTML = S.children.map(function(k){
    return '<option value="'+esc(k.id)+'"'+(k.id===S.childId?' selected':'')+'>'+esc(k.name)+'</option>';
  }).join('');
  $('childSel').style.display = S.children.length > 1 ? 'block' : 'none';
}
function switchChild(id){ S.childId = id; localStorage.setItem('childId', id); S.cache = {}; go(S.tab); }

function go(tab){
  S.tab = tab;
  ['today','growth','sched'].forEach(function(t){
    var b = $('nav-'+t); if(b) b.classList.toggle('on', t===tab);
  });
  window.scrollTo(0,0);
  busy();

/* ── 공통 조각 ───────────────────────────────────────── */
function sec(title, count){
  return '<div class="sec">'+esc(title)+(count!=null?' <span class="n">'+count+'</span>':'')+'</div>';
}
function list(rows){ return rows.length ? '<div class="list">'+rows.join('')+'</div>' : ''; }

/** 일정 한 줄 — 탭하면 완료 처리 시트가 열린다 */
function itemRow(it){
  if(it.needsChoice) return choiceRow(it);
  var tone = it.alert ? 'red' : it.status==='open' ? 'green' : '';
  var meta = it.advisory ? esc(it.note)
           : esc(it.start)+' ~ '+esc(it.end)+(it.shifted?' · 앞 차수 지연 반영':'');
  return '<button class="row" onclick="markDone(\''+esc(it.key)+'\',\''+esc(it.name)+'\')">'+
    '<span class="main"><span class="t">'+esc(it.name)+
      (it.dose?' <span style="color:var(--label-2)">'+it.dose+
        (it.totalDoses?'/'+it.totalDoses:'')+'차</span>':'')+'</span>'+
    '<span class="d">'+meta+'</span></span>'+
    (it.dday?'<span class="badge '+tone+'">'+esc(it.dday)+'</span>':'')+
    '<span class="chev">›</span></button>';
}

function doneRow(it){
  return '<div class="row done tappable" onclick="undo(\''+esc(it.key)+'\')">'+
    '<span class="main"><span class="t">'+esc(it.name)+
      (it.dose?' '+it.dose+'차':'')+'</span>'+
    '<span class="d">'+esc(it.doneDate)+' 완료</span></span>'+
    '<span class="badge green">✓</span></div>';
}

function choiceRow(it){
  var series = it.code==='RV' ? 'rota' : 'je';
  return '<div class="row"><span class="main">'+
    '<span class="t">'+esc(it.name)+' 종류 선택</span>'+
    '<span class="d">'+esc(it.note)+'</span>'+
    '<span style="display:flex;gap:8px;margin-top:10px">'+
      it.choices.map(function(c){
        return '<button class="btn tinted small" onclick="pickVaccine(\''+series+'\',\''+esc(c.key)+'\')">'+
               esc(c.label)+'</button>';

function field(label, inner){

}

/* ── 홈 — 다음 병원 방문 ─────────────────────────────── */
function renderToday(){
  Promise.all([ call('visits', { childId: S.childId }),
                call('dashboard', { childId: S.childId }) ])
  .then(function(r){
    var V = r[0], d = r[1];
    VISITS = V.visits;
    $('ageLabel').textContent = d.child.ageLabel;
    var h = '';

    if(V.visits.length){
      h += visitCard(V.visits[0], V.visits[1]);
    } else {
      h += '<div class="visit"><div class="visit-head">'+
        '<div class="visit-sum" style="color:var(--green)">당장 병원 갈 일이 없습니다</div>'+
        '<div class="visit-why">'+(V.laterCount ? '다음 일정은 '+V.laterCount+'건, 아직 시간이 있습니다.'
                                                : '예정된 접종·검진이 모두 끝났습니다.')+'</div>'+
        '</div></div>';
    }

    // 성장 — 숫자 세 개면 충분하다
    if(d.growth){
      h += sec('성장 · ' + esc(d.growth.date) + ' 측정');
      h += '<div class="tiles">';
      ['lhfa','wfa','hcfa'].forEach(function(k){
        var m = d.growth.metrics[k]; if(!m) return;
        h += '<div class="tile"><div class="k">'+esc(m.label)+'</div>'+
             '<div class="v">'+esc(m.value)+'<span class="u">'+esc(m.unit)+'</span></div>'+
             '<div class="p">'+esc(m.text)+'</div></div>';
      });
      h += '</div>';
      d.growth.trends.forEach(function(t){
        h += '<div style="margin-top:10px"><div class="note '+(t.trend==='down'?'warn':'')+'">'+
             esc(t.message)+'</div></div>';
      });
    } else {
      h += sec('성장');

        '<span class="main"><span class="t" style="color:var(--blue)">키·몸무게 입력하기</span>'+
        '<span class="d">넣는 즉시 백분위가 계산됩니다</span></span>'+
        '<span class="chev">›</span></button></div>';
    }

    // 병원 밖에서 할 일 — 행정·직접 추가한 것
    var offsite = d.overdue.concat(d.open).filter(function(x){
      return x.code === 'admin' || x.needsChoice;
    });
    if(offsite.length || d.todos.length){
      h += sec('병원 밖에서 할 일', (offsite.length + d.todos.length) || null);
      var rows = offsite.map(itemRow);
      d.todos.forEach(function(t){

          '<span class="main"><span class="t">'+esc(t.title)+'</span>'+
          '<span class="d">'+(t.due?esc(t.due):'기한 없음')+(t.owner?' · '+esc(t.owner):'')+'</span></span>'+
          '<span class="badge">완료</span></div>');

        '<span class="chev">›</span></button>');
      h += list(rows);

  }).catch(fail);
}

/** 방문 카드 — 날짜 하나, 문장 하나, 버튼 두 개 */
function visitCard(v, next){
  var urgent = v.overdueCount > 0;
  var when = v.daysAway <= 0 ? '지금 가셔도 됩니다'
           : v.daysAway === 1 ? '내일'
           : v.daysAway + '일 뒤';

  var h = '<div class="visit'+(urgent?' urgent':'')+'">'+
    '<div class="visit-head">'+
      '<div class="visit-when">다음 병원 방문 · '+esc(when)+'</div>'+
      '<div class="visit-date">'+esc(v.dateLabel)+'</div>'+
      '<div class="visit-sum">'+esc(v.summary)+'</div>'+
      '<div class="visit-why">'+esc(v.reason)+'</div>'+
    '</div>'+
    '<div class="visit-items">'+
      v.items.map(function(it){
        var cls = it.status==='overdue' ? 'late' : it.free ? 'free' : '';
        return '<span class="chip '+cls+'">'+esc(shortName(it.name))+
               (it.dose?' '+it.dose+'차':'')+'</span>';
      }).join('')+
    '</div>'+
    '<div class="visit-acts">'+
      (v.daysAway > 0
        ? '<button class="btn tinted" onclick="openVisitDone()">다녀왔어요</button>'+
          '<button class="btn" onclick="addVisitToCalendar()">캘린더에 넣기</button>'
        : '<button class="btn tinted" onclick="addVisitToCalendar()">캘린더에 넣기</button>'+
          '<button class="btn" onclick="openVisitDone()">다녀왔어요</button>')+
    '</div>';

  if(next){
    h += '<div class="visit-next">그 다음 — '+esc(next.dateLabel)+' · '+
         esc(next.items.length)+'개 '+
         '<span style="color:var(--label-3)">('+esc(next.items.map(function(i){
           return shortName(i.name); }).slice(0,3).join(', '))+
         (next.items.length>3?' 외':'')+')</span></div>';
  }
  return h + '</div>';
}

function renderGrowth(){

/** 백분위 밴드 + 우리 아이 곡선. 외부 라이브러리 없이 SVG 직접 생성 */
function chartSvg(ch){
  var W = 520, H = 240, P = { l: 36, r: 14, t: 12, b: 24 };
  var ys = [];
  ch.bands.forEach(function(b){ b.points.forEach(function(p){ ys.push(p.y); }); });
  ch.points.forEach(function(p){ ys.push(p.y); });
  if(!ys.length) return '<div class="empty">표시할 데이터가 없습니다</div>';

  var x0 = 0, x1 = ch.maxDays;
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad;
  var X = function(v){ return P.l + (v - x0) / (x1 - x0 || 1) * (W - P.l - P.r); };
  var Y = function(v){ return H - P.b - (v - y0) / (y1 - y0 || 1) * (H - P.t - P.b); };
  var path = function(pts){ return 'M'+pts.map(function(p){
    return X(p.x).toFixed(1)+','+Y(p.y).toFixed(1); }).join('L'); };

  var svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" '+
            'aria-label="'+esc(ch.label)+' 백분위 그래프">';

  // 3~97 백분위 사이를 옅게 채운다
  var lo = ch.bands[0].points, hi = ch.bands[4].points;
  svg += '<path d="'+path(lo)+'L'+hi.slice().reverse().map(function(p){
           return X(p.x).toFixed(1)+','+Y(p.y).toFixed(1); }).join('L')+
         'Z" fill="var(--blue)" opacity=".06"/>';

  ch.bands.forEach(function(b){
    var mid = b.percentile === 50;
    svg += '<path d="'+path(b.points)+'" fill="none" stroke="currentColor" '+
           'opacity="'+(mid?'.32':'.16')+'" stroke-width="1" '+
           'stroke-dasharray="'+(mid?'':'2 4')+'" stroke-linecap="round"/>';
    var last = b.points[b.points.length-1];
    svg += '<text x="'+(X(last.x)+3)+'" y="'+(Y(last.y)+3)+'" font-size="9" '+
           'fill="currentColor" opacity=".35">'+b.percentile+'</text>';
  });

  for(var i=0;i<=3;i++){
    var v = y0 + (y1-y0)*i/3;
    svg += '<text x="4" y="'+(Y(v)+3.5)+'" font-size="10" fill="currentColor" opacity=".35">'+
           v.toFixed(v<20?1:0)+'</text>';
  }
  var months = x1/30.44, stepM = months<=8?2:months<=20?4:months<=40?6:12;
  for(var mth=0; mth<=months; mth+=stepM){
    svg += '<text x="'+X(mth*30.44)+'" y="'+(H-7)+'" font-size="10" fill="currentColor" '+
           'opacity=".35" text-anchor="middle">'+mth+'</text>';
  }
  svg += '<text x="'+(W-P.r)+'" y="'+(H-7)+'" font-size="10" fill="currentColor" '+
         'opacity=".35" text-anchor="end">개월</text>';

  if(ch.points.length){
    svg += '<path d="'+path(ch.points)+'" fill="none" stroke="var(--blue)" stroke-width="2.5" '+
           'stroke-linejoin="round" stroke-linecap="round"/>';
    ch.points.forEach(function(p){
      svg += '<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4" '+
             'fill="var(--card)" stroke="var(--blue)" stroke-width="2.5">'+
             '<title>'+esc(p.date)+' · '+p.y+' · '+Math.round(p.percentile)+'p</title></circle>';
    });
  }
  return svg + '</svg>';
}

/* ── 일정 ────────────────────────────────────────────── */
var SFILTER = 'todo';
function renderSched(){
  call('schedule', { childId: S.childId }).then(function(d){
    var h = '<div class="seg">'+
      [['todo','남은 것'],['all','전체'],['done','완료']].map(function(x){
        return '<button class="'+(SFILTER===x[0]?'on':'')+'" onclick="setSF(\''+x[0]+'\')">'+x[1]+'</button>';
      }).join('')+'</div>';

    var past = d.items.filter(function(x){ return !x.doneDate && !x.needsChoice && !x.advisory &&
                                                  (x.status==='overdue' || x.status==='open'); });
    if(past.length >= 5){
      h += '<div class="list"><button class="row" onclick="openBulk()">'+
        '<span class="main"><span class="t">이미 하신 게 있나요?</span>'+
        '<span class="d">'+past.length+'개 항목이 남아 있습니다. 아기수첩 보고 한 번에 입력하세요.</span></span>'+
        '<span class="chev">›</span></button></div>';
    }

    var items = d.items.filter(function(it){
      if(SFILTER==='todo') return !it.doneDate;
      if(SFILTER==='done') return !!it.doneDate;
      return true;
    });

    var groups = {};
    items.forEach(function(it){
      var g = it.code==='영유아'||it.code==='구강' ? '건강검진' : it.code==='admin' ? '행정' : '예방접종';
      (groups[g] = groups[g] || []).push(it);
    });

    ['예방접종','건강검진','행정'].forEach(function(g){
      if(!groups[g] || !groups[g].length) return;
      h += sec(g, groups[g].length);
      h += list(groups[g].map(function(it){ return it.doneDate ? doneRow(it) : itemRow(it); }));
    });

    if(!items.length) h += '<div class="empty">해당하는 항목이 없습니다</div>';

    h += '<div style="margin-top:24px"><div class="note">'+esc(d.comboNote)+'</div></div>';
    h += footNote();
    view(h);
  }).catch(fail);
}
function setSF(f){ SFILTER = f; go('sched'); }
function undo(key){
  if(!confirm('완료를 취소할까요?')) return;
  call('scheduleUndone', { childId: S.childId, key: key })
    .then(function(){ toast('취소했습니다'); go('sched'); }).catch(function(e){ toast(e.message); });
}

/* ── 지금까지 한 것 일괄 입력 ─────────────────────────── */
function openBulk(){
  busy();
  call('schedule', { childId: S.childId }).then(function(d){
    var past = d.items.filter(function(x){ return !x.doneDate && !x.needsChoice && !x.advisory &&
                                                  (x.status==='overdue' || x.status==='open'); });
    var h = '<div class="note">아기수첩·병원 기록을 보고 <b>이미 한 것만</b> 켜세요. '+
      '날짜를 모르면 그대로 두면 기한 마지막 날로 추정 입력됩니다. '+
      '다음 차수 계산에 쓰이니 아는 날짜는 정확히 넣는 편이 좋습니다.</div>';

    h += sec('전부 같은 날 맞았다면');
    h += '<div class="list">'+field('날짜', '<input id="bulkAll" type="date">')+
      '<button class="row" onclick="applyBulkDate()">'+
      '<span class="main"><span class="t" style="color:var(--blue)">켜둔 항목에 모두 적용</span></span>'+
      '</button></div>';

    h += sec('항목', past.length);
    h += '<div class="list">'+past.map(function(it, i){
      return '<div class="row"><label class="check" style="flex:1">'+
          '<span class="txt"><span class="t">'+esc(it.name)+(it.dose?' '+it.dose+'차':'')+'</span>'+
          '<span class="d">권장 '+esc(it.start)+' ~ '+esc(it.end)+'</span>'+
          '<span class="d" style="margin-top:6px;display:block">'+
            '<input type="date" id="bd'+i+'" value="'+esc(it.end)+'" data-default="'+esc(it.end)+'">'+
          '</span></span>'+
          '<span class="switch"><input type="checkbox" class="bulkChk" data-key="'+esc(it.key)+'" '+
            'data-i="'+i+'"><span class="track"></span><span class="knob"></span></span>'+
        '</label></div>';
    }).join('')+'</div>';

    h += '<div class="btn-row">'+
      '<button class="btn tinted" style="flex:1" onclick="go(\'sched\')">취소</button>'+
      '<button class="btn" style="flex:2" onclick="submitBulk()">켜둔 항목 저장</button></div>';
    h += footNote();
    view(h);
  }).catch(fail);
}
function applyBulkDate(){
  var v = $('bulkAll').value;
  if(!v) return toast('날짜를 고르세요');
  var boxes = document.querySelectorAll('.bulkChk'), n = 0;
  for(var i=0;i<boxes.length;i++){
    if(boxes[i].checked){ $('bd'+boxes[i].getAttribute('data-i')).value = v; n++; }
  }
  toast(n ? n+'개 항목에 적용했습니다' : '켜둔 항목이 없습니다');
}
function submitBulk(){
  var boxes = document.querySelectorAll('.bulkChk'), items = [];
  for(var i=0;i<boxes.length;i++){
    if(!boxes[i].checked) continue;
    var el = $('bd'+boxes[i].getAttribute('data-i'));
    items.push({ key: boxes[i].getAttribute('data-key'), date: el.value,
                 approx: el.value === el.getAttribute('data-default') });
  }
  if(!items.length) return toast('켜둔 항목이 없습니다');
  call('scheduleBulkDone', { childId: S.childId, items: items }).then(function(r){
    toast(r.saved + '건 저장했습니다' + (r.skipped.length ? ' ('+r.skipped.length+'건 건너뜀)' : ''));
    go('sched');
  }).catch(function(e){ toast(e.message); });
}

/* ── 아이 설정 ───────────────────────────────────────── */
function openChildForm(){ renderChildForm(false); }
function renderChildForm(first){
  var c = first ? {} : (S.children.filter(function(x){ return x.id===S.childId; })[0] || {});
  var h = first
    ? '<div class="note">아이 정보를 먼저 등록해 주세요.<br>'+
      '<b>생년월일</b>로 접종·검진 일정이 자동 계산됩니다.</div>'
    : '';

  h += sec('기본 정보');
  h += '<div class="list">'+
    field('이름', '<input id="cName" value="'+esc(c.name||'')+'" placeholder="아이 이름">')+
    '<div class="field"><div class="pair">'+
      '<div><label>생년월일</label><input id="cBirth" type="date" value="'+esc(c.birthDate||'')+'"></div>'+
      '<div><label>성별</label><select id="cSex">'+
        '<option'+(c.sexLabel==='남'?' selected':'')+'>남</option>'+
        '<option'+(c.sexLabel==='여'?' selected':'')+'>여</option></select></div>'+
    '</div></div>'+
    '</div>';

  h += sec('응급 정보');
  h += '<div class="list">'+
    field('혈액형', '<input id="cBlood" value="'+esc(c.blood||'')+'" placeholder="예: A+">')+
    field('알레르기', '<input id="cAllergy" value="'+esc(c.allergy||'')+'" placeholder="없으면 비워두세요">')+
    field('특이사항', '<input id="cNote" value="'+esc(c.note||'')+'">')+
    '</div>';

  h += '<div class="btn-row"><button class="btn wide" onclick="saveChild(\''+esc(first?'':(c.id||''))+'\')">저장</button></div>';

  if(!first && S.children.length){
    h += sec('둘째');
    h += '<div class="list"><button class="row" onclick="renderChildForm(true)">'+
      '<span class="main"><span class="t" style="color:var(--blue)">아이 추가</span>'+
      '<span class="d">아이마다 일정과 기록이 따로 관리됩니다</span></span>'+
      '<span class="chev">›</span></button></div>';
  }
  h += footNote();
  view(h);
}
function saveChild(id){
  call('childSave', { id: id || '', name: $('cName').value, birthDate: $('cBirth').value,
                      sexLabel: $('cSex').value, blood: $('cBlood').value,
                      allergy: $('cAllergy').value, note: $('cNote').value })
    .then(function(r){
      return call('bootstrap').then(function(d){
        S.children = d.children; S.childId = r.id;
        localStorage.setItem('childId', r.id);
        renderChildSelect(); toast('저장했습니다'); go('today');
      });
    }).catch(function(e){ toast(e.message); });
}

function footNote(){
  return '<div class="foot">접종·검진 일정은 <b>참고용</b>입니다. 최종 확인은 '+
    '<a href="https://nip.kdca.go.kr" target="_blank" rel="noopener">예방접종도우미</a>와 소아과에서 하세요.<br>'+
    '성장 백분위는 WHO 성장표준(0~5세) 기준입니다.</div>';
}
</script>
